<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1445" />
      <stop offset="100%" stop-color="#05030f" />
    </linearGradient>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6d92ff" />
      <stop offset="100%" stop-color="#111f65" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="920" height="280" rx="32" fill="url(#bg)" />
  <rect x="20" y="20" width="880" height="240" rx="28" fill="rgba(255,255,255,0.05)" />
  <g opacity="0.75">
    <circle cx="720" cy="60" r="62" fill="rgba(255,255,255,0.08)" />
    <circle cx="160" cy="220" r="66" fill="rgba(255,255,255,0.06)" />
  </g>

  <text x="45" y="74" fill="#ffe600" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">Pac-Man</text>
  <text x="45" y="110" fill="#cbd8ff" font-family="Inter, sans-serif" font-size="18">Banner animado em SVG para README de perfil</text>

  <g stroke="none" fill="url(#wall)">
    <rect x="40" y="150" width="120" height="22" rx="10" />
    <rect x="180" y="150" width="280" height="22" rx="10" />
    <rect x="500" y="150" width="280" height="22" rx="10" />
    <rect x="120" y="190" width="22" height="80" rx="10" />
    <rect x="220" y="190" width="22" height="80" rx="10" />
    <rect x="340" y="190" width="22" height="80" rx="10" />
    <rect x="660" y="190" width="22" height="80" rx="10" />
    <rect x="760" y="190" width="22" height="80" rx="10" />
    <rect x="560" y="60" width="260" height="22" rx="10" />
    <rect x="120" y="60" width="220" height="22" rx="10" />
  </g>

  <g fill="#ffe600" filter="url(#glow)">
    <circle cx="100" cy="170" r="8" />
    <circle cx="180" cy="170" r="8" />
    <circle cx="260" cy="170" r="8" />
    <circle cx="380" cy="170" r="8" />
    <circle cx="520" cy="170" r="8" />
    <circle cx="600" cy="170" r="8" />
    <circle cx="680" cy="170" r="8" />
    <circle cx="760" cy="170" r="8" />
  </g>

  <g filter="url(#glow)">
    <circle cx="100" cy="70" r="7" fill="#fff" opacity="0.9" />
    <circle cx="420" cy="70" r="7" fill="#fff" opacity="0.9" />
    <circle cx="740" cy="70" r="7" fill="#fff" opacity="0.9" />
  </g>

  <g id="pacman" transform="translate(115,170)">
    <circle cx="0" cy="0" r="20" fill="#ffe600" />
    <polygon points="0,-20 40,0 0,20" fill="#05030f" opacity="0.95">
      <animate attributeName="points" dur="0.45s" repeatCount="indefinite"
        values="0,-20 40,0 0,20; 0,-12 32,0 0,12; 0,-20 40,0 0,20" />
    </polygon>
  </g>

  <animateTransform xlink:href="#pacman" attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
    values="115,170; 350,170; 350,80; 640,80; 640,170; 820,170" keyTimes="0;0.2;0.4;0.6;0.8;1" />

  <g id="ghost" transform="translate(720,110)">
    <path d="M-22,0 h44 a22,22 0 0 1 0,44 l-5,-6 l-10,6 l-10,-6 l-5,6 z" fill="#ff0050" />
    <circle cx="-10" cy="16" r="6" fill="#fff" />
    <circle cx="10" cy="16" r="6" fill="#fff" />
    <circle cx="-10" cy="18" r="2.5" fill="#05030f" />
    <circle cx="10" cy="18" r="2.5" fill="#05030f" />
  </g>

  <animateTransform xlink:href="#ghost" attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
    values="720,110; 620,110; 720,110; 820,110; 720,110" keyTimes="0;0.25;0.5;0.75;1" />

  <path d="M 60 170 L 820 170" stroke="#68b8ff" stroke-width="2" stroke-dasharray="12 12" opacity="0.4" />
</svg>
