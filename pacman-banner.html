<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="pacman-banner.css">
</head>
<body>
  <div class="banner">
    <div class="maze">
      <div class="maze-grid">
        <div class="wall" style="grid-column: 1 / span 3; grid-row: 1 / span 2"></div>
        <div class="wall" style="grid-column: 5 / span 11; grid-row: 1 / span 2"></div>
        <div class="wall" style="grid-column: 18 / span 3; grid-row: 1 / span 2"></div>
        <div class="wall" style="grid-column: 1 / span 3; grid-row: 4 / span 2"></div>
        <div class="wall" style="grid-column: 4 / span 2; grid-row: 4 / span 1"></div>
        <div class="wall" style="grid-column: 8 / span 6; grid-row: 4 / span 1"></div>
        <div class="wall" style="grid-column: 16 / span 4; grid-row: 4 / span 2"></div>
        <div class="wall" style="grid-column: 1 / span 2; grid-row: 7 / span 3"></div>
        <div class="wall" style="grid-column: 4 / span 3; grid-row: 7 / span 2"></div>
        <div class="wall" style="grid-column: 9 / span 4; grid-row: 7 / span 2"></div>
        <div class="wall" style="grid-column: 14 / span 3; grid-row: 8 / span 2"></div>
        <div class="wall" style="grid-column: 18 / span 3; grid-row: 7 / span 3"></div>
        <div class="wall" style="grid-column: 7 / span 1; grid-row: 2 / span 6"></div>
        <div class="wall" style="grid-column: 12 / span 1; grid-row: 2 / span 6"></div>
        <div class="dot" style="grid-column: 3; grid-row: 3"></div>
        <div class="dot" style="grid-column: 6; grid-row: 2"></div>
        <div class="dot" style="grid-column: 10; grid-row: 3"></div>
        <div class="dot" style="grid-column: 15; grid-row: 2"></div>
        <div class="dot" style="grid-column: 18; grid-row: 3"></div>
        <div class="dot" style="grid-column: 5; grid-row: 6"></div>
        <div class="dot" style="grid-column: 17; grid-row: 6"></div>
        <div class="dot" style="grid-column: 2; grid-row: 9"></div>
        <div class="dot" style="grid-column: 6; grid-row: 8"></div>
        <div class="dot" style="grid-column: 11; grid-row: 8"></div>
        <div class="dot" style="grid-column: 17; grid-row: 9"></div>
      </div>
      <div class="pacman"></div>
      <div class="ghost">
        <div class="ghost-eye"></div>
      </div>
      <div class="label">Demo CSS</div>
    </div>
  </div>
</body>
</html>
